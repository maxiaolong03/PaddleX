Global:
  model: PP-DocLayoutV4
  mode: check_dataset # check_dataset/train/evaluate/predict
  dataset_dir: "./dataset/doclayoutv4_examples"
  device: gpu:0,1,2,3
  output: "output"

CheckDataset:
  convert:
    enable: False
    src_dataset_type: null
  split:
    enable: False
    train_percent: null
    val_percent: null

Train:
  num_classes: 25
  epochs_iters: 100
  batch_size: 4
  learning_rate: 0.0001
  # No PP-DocLayoutV4_pretrained.pdparams has been published yet. Leaving this
  # null falls back to the repo_apis config's `pretrain_weights`
  # (PP-DocLayout_plus-L_pretrained.pdparams), which is what the reference
  # PaddleDetection config initializes from. Point both this and
  # `Export.weight_path` at the V4 checkpoint once it is uploaded.
  pretrain_weight_path: null
  warmup_steps: 100
  resume_path: null
  log_interval: 10
  eval_interval: 1

Evaluate:
  weight_path: "output/best_model/best_model.pdparams"
  log_interval: 10

Export:
  weight_path: "output/best_model/best_model.pdparams"

Predict:
  batch_size: 1
  model_dir: "output/best_model/inference"
  input: "https://paddle-model-ecology.bj.bcebos.com/paddlex/imgs/demo_image/layout.jpg"
  kernel_option:
    run_mode: paddle
